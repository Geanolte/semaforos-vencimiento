/* ================= operario: pick carga (home) ================= */
function renderOperarioHome(){
  var html = renderTopbar() + '<div class="wrap narrow">';
  var cargas = cargasVisibles();
  html += '<p class="eyebrow">Tus asignaciones · '+esc(state.identity.ciudad)+'</p><h1 style="font-size:20px;margin-bottom:14px;">Elige una carga</h1>';
  if(!cargas.length){
    html += '<div class="card empty">Aún no hay ninguna carga creada en '+esc(state.identity.ciudad)+'. Pide a tu coordinador o supervisor que la cree y te asigne referencias.</div>';
  } else {
    cargas.forEach(function(c){
      html += '<div class="item-row" data-id="'+c.id+'"><div class="ico">📦</div><div class="info"><div class="t">'+esc(c.bodegaDesc||"Carga")+'</div><div class="m">'+esc(c.bodega||"")+' · '+(c.totalItems||0)+' referencias</div></div><div>→</div></div>';
    });
  }
  html += '</div>';
  root.innerHTML = html;
  wireTopbar();
  root.querySelectorAll(".item-row").forEach(function(r){ r.onclick = function(){ openCargaOperario(r.getAttribute("data-id")); }; });
}

function openCargaOperario(id){
  if(state.unsubItems) state.unsubItems();
  var unsub = Store.onItems(id, function(items){ setState({items:items}); });
  setState({currentCargaId:id, view:"mine", unsubItems:unsub});
}

/* ================= operario: my items ================= */
function myItems(){
  return state.items.filter(function(it){ return it.asignadoA === state.identity.id; });
}

function renderOperarioMine(){
  var mine = myItems();
  var pend = mine.filter(function(i){return i.estado!=="finalizado";});
  var done = mine.filter(function(i){return i.estado==="finalizado";});
  var pct = mine.length ? Math.round(done.length/mine.length*100) : 0;

  var html = renderTopbar() + '<div class="wrap narrow">';
  html += '<button class="btn ghost sm" id="backBtn" style="margin-bottom:8px;">← Cambiar carga</button>';
  html += '<p class="eyebrow">Mis referencias</p><h1 style="font-size:20px;margin-bottom:10px;">'+mine.length+' asignadas</h1>';

  if(!mine.length){
    html += '<div class="card empty">No tienes referencias asignadas en esta carga todavía. Pide a tu coordinador o supervisor que te asigne alguna.</div></div>';
    root.innerHTML = html; wireTopbar();
    root.querySelector("#backBtn").onclick = backToOperarioHome;
    return;
  }

  html += '<div class="card" style="margin-bottom:14px;"><div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;"><span>Avance</span><span>'+done.length+'/'+mine.length+'</span></div><div class="progress-bar"><div style="width:'+pct+'%;"></div></div></div>';

  var modoScan = scanMode();
  if(modoScan==="lector"){
    html += '<div class="card" style="margin-bottom:10px;"><label style="display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;">Escanea con el lector</label>'+
      '<input id="scanInput" inputmode="none" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Apunta el lector al código y dispara" style="width:100%;padding:13px 14px;border:2px solid var(--accent);border-radius:var(--radius-md);background:var(--bg);">'+
      '<div id="scanMsg" class="hint" style="margin-top:6px;">El código se reconoce solo al disparar.</div></div>';
  } else {
    html += '<button class="scan-btn" id="btnScan">📷 Escanear código de barras</button>';
  }
  html += '<div style="text-align:right;margin:-4px 0 10px;"><button class="btn ghost sm" id="btnModo" type="button">'+(modoScan==="lector"?"Usar cámara":"Usar lector de código")+'</button></div>';
  html += '<div class="searchbar"><input id="searchInput" autocomplete="off" placeholder="Buscar por descripción..." value="'+esc(state._search||"")+'"></div>';
  html += '<div id="mineListBox">'+buildMineListHtml(mine)+'</div>';

  html += '</div>';
  root.innerHTML = html;
  wireTopbar();
  root.querySelector("#backBtn").onclick = backToOperarioHome;
  var btnScan = root.querySelector("#btnScan"); if(btnScan) btnScan.onclick = openScanner;
  root.querySelector("#btnModo").onclick = function(){ setScanMode(modoScan==="lector" ? "camara" : "lector"); render(); };
  wireScanInput();
  wireMineListClicks();
  var searchInput = root.querySelector("#searchInput");
  searchInput.oninput = debounce(function(e){
    state._search = e.target.value;
    var box = root.querySelector("#mineListBox");
    if(box){ box.innerHTML = buildMineListHtml(myItems()); wireMineListClicks(); }
  }, 120);
}

function buildMineListHtml(mine){
  var list = mine.filter(function(it){
    if(!state._search) return true;
    return it.descItem.toLowerCase().indexOf(state._search.toLowerCase())>-1;
  });
  if(!list.length){
    return '<div class="card empty">Ningún producto asignado coincide con "'+esc(state._search||"")+'".</div>';
  }
  return list.map(function(it){
    var badge = it.estado==="finalizado" ? '<span class="pill green dot">Listo</span>' : it.estado==="en_progreso" ? '<span class="pill amber dot">En curso</span>' : '<span class="pill neutral dot">Pendiente</span>';
    return '<div class="item-row" data-id="'+it.id+'"><div class="ico">🏷️</div><div class="info"><div class="t">'+esc(it.descItem)+'</div><div class="m">Ref. '+esc(it.referencia)+' · '+(it.registros?it.registros.length:0)+' lote(s)</div></div>'+badge+'</div>';
  }).join("");
}

function wireMineListClicks(){
  root.querySelectorAll("#mineListBox .item-row").forEach(function(r){
    r.onclick = function(){ openEntry(r.getAttribute("data-id"), false); };
  });
}

function backToOperarioHome(){
  if(state.unsubItems) state.unsubItems();
  setState({view:"home", currentCargaId:null, items:[], unsubItems:null});
}

/* ================= operario: scanner modal ================= */
var zxingReader = null;
function openScanner(){
  var m = document.createElement("div");
  m.className = "modal-bg";
  m.innerHTML = '<div class="modal">'+
    '<div class="modal-head"><h2 style="font-size:17px;">Escanear código de barras</h2><button id="mClose">×</button></div>'+
    '<div class="video-wrap"><video id="scanVideo" muted playsinline></video><div class="frame"><div class="laser"></div></div></div>'+
    '<div id="scanStatus" class="hint" style="margin-bottom:10px;">Apunta la cámara al código de barras del producto.</div>'+
    '<div style="border-top:1px solid var(--border);padding-top:12px;">'+
      '<label style="display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;">¿No escanea? Escribe el código manualmente</label>'+
      '<div style="display:flex;gap:8px;"><input id="manualCode" placeholder="Código de barras" style="flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--bg);"><button class="btn" id="btnManual">Buscar</button></div>'+
    '</div>'+
  '</div>';
  document.body.appendChild(m);

  function close(){
    try{ if(zxingReader) zxingReader.reset(); }catch(e){}
    zxingReader = null;
    m.remove();
  }
  m.querySelector("#mClose").onclick = close;
  m.onclick = function(e){ if(e.target===m) close(); };

  m.querySelector("#btnManual").onclick = function(){
    var code = m.querySelector("#manualCode").value.trim();
    if(code) handleScanResult(code, close, m);
  };

  if(window.ZXing && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    try{
      zxingReader = new ZXing.BrowserMultiFormatReader();
      var onFrame = function(result, err){
        if(result){ handleScanResult(result.getText(), close, m); }
      };
      var constraints = {video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}, advanced:[{focusMode:"continuous"}]}};
      zxingReader.decodeFromConstraints(constraints, "scanVideo", onFrame).catch(function(){
        return zxingReader.decodeFromVideoDevice(null, "scanVideo", onFrame);
      }).catch(function(err){
        m.querySelector("#scanStatus").innerHTML = '<span style="color:var(--danger);">No se pudo acceder a la cámara ('+esc(err&&err.name||"error")+'). Usa el código manual abajo.</span>';
      });
    }catch(e){
      m.querySelector("#scanStatus").innerHTML = '<span style="color:var(--danger);">El escáner no está disponible en este navegador. Usa el código manual.</span>';
    }
  } else {
    m.querySelector("#scanStatus").innerHTML = 'Cámara no disponible en este navegador/dispositivo. Usa el código manual abajo.';
  }
}

/* ---- modo de escaneo: lector (RF / pistola que "teclea" el código) o cámara ----
   Por defecto depende de la ciudad (Pereira: lector); cada dispositivo puede cambiarlo y lo recuerda. */
function scanMode(){
  try{ var v = localStorage.getItem("semaforos_scanmode_v1"); if(v==="lector"||v==="camara") return v; }catch(e){}
  var c = state.identity ? ciudadPorNombre(state.identity.ciudad) : null;
  return c ? c.scan : "camara";
}
function setScanMode(v){ try{ localStorage.setItem("semaforos_scanmode_v1", v); }catch(e){} }
function normCodigo(s){ return String(s==null?"":s).replace(/\D/g,"").replace(/^0+/,""); }

function wireScanInput(){
  var inp = root.querySelector("#scanInput"); if(!inp) return;
  var t0 = 0, timer = null;
  function enviar(){
    clearTimeout(timer);
    var code = inp.value.trim(); inp.value = ""; t0 = 0;
    if(code) handleScanResult(code, function(){}, null);
  }
  inp.onkeydown = function(e){ if(e.key==="Enter" || e.key==="Tab"){ e.preventDefault(); enviar(); } };
  /* Si el lector no envía Enter: ráfaga rápida de caracteres = lector; se envía al terminar la ráfaga. */
  inp.oninput = function(){
    var n = inp.value.length, now = Date.now();
    if(n===1) t0 = now;
    clearTimeout(timer);
    timer = setTimeout(function(){
      var len = inp.value.length;
      if(len>=6 && t0 && (now - t0) / Math.max(len-1,1) < 60) enviar();
    }, 140);
  };
  inp.onblur = function(){
    setTimeout(function(){
      var a = document.activeElement;
      if(!document.querySelector(".modal-bg") && (!a || a===document.body) && document.body.contains(inp)) inp.focus();
    }, 150);
  };
  inp.focus();
}

function handleScanResult(code, close, modal){
  try{ if(zxingReader) zxingReader.reset(); }catch(e){}
  var mine = myItems(), nc = normCodigo(code);
  var match = mine.find(function(it){ return it.barcode && normCodigo(it.barcode)===nc && nc; });
  close();
  if(match){
    openEntry(match.id, false);
  } else {
    showMismatchModal(code);
  }
}

function showMismatchModal(code){
  var mine = myItems();
  var m = document.createElement("div");
  m.className = "modal-bg";
  m.innerHTML = '<div class="modal">'+
    '<div class="modal-head"><h2 style="font-size:17px;">Código no coincide</h2><button id="mClose">×</button></div>'+
    '<div class="banner warn">El código <code>'+esc(code)+'</code> no está en tus referencias asignadas con ese código de barras (RF-07). Es posible que el código físico del producto sea distinto al registrado en SIESA. Confirma el producto por descripción.</div>'+
    '<div class="field"><label>Buscar por descripción</label><input id="mismatchSearch" placeholder="Escribe parte del nombre del producto"></div>'+
    '<div id="mismatchResults"></div>'+
  '</div>';
  document.body.appendChild(m);
  m.querySelector("#mClose").onclick = function(){ m.remove(); };
  m.onclick = function(e){ if(e.target===m) m.remove(); };
  function renderResults(q){
    var box = m.querySelector("#mismatchResults");
    var list = mine.filter(function(it){ return !q || it.descItem.toLowerCase().indexOf(q.toLowerCase())>-1; }).slice(0,8);
    box.innerHTML = list.map(function(it){
      return '<div class="item-row" data-id="'+it.id+'"><div class="ico">🏷️</div><div class="info"><div class="t">'+esc(it.descItem)+'</div><div class="m">Ref. '+esc(it.referencia)+'</div></div></div>';
    }).join("") || '<div class="hint">Sin resultados.</div>';
    box.querySelectorAll(".item-row").forEach(function(r){
      r.onclick = function(){ m.remove(); openEntry(r.getAttribute("data-id"), true, code); };
    });
  }
  renderResults("");
  m.querySelector("#mismatchSearch").oninput = debounce(function(e){ renderResults(e.target.value); }, 120);
}

/* ================= operario: entry screen ================= */
function openEntry(itemId, manualConfirm, scannedCode){
  state.activeItemId = itemId;
  state._entryManualConfirm = manualConfirm || false;
  state._entryScannedCode = scannedCode || null;
  state._entryCantidad = "";
  state._entryFecha = todayISO();
  setState({view:"entry"});
}

function renderOperarioEntry(){
  var it = state.items.find(function(x){return x.id===state.activeItemId;});
  if(!it){ setState({view:"mine"}); return; }
  var html = renderTopbar() + '<div class="wrap narrow">';
  html += '<button class="btn ghost sm" id="backBtn" style="margin-bottom:8px;">← Volver a mi lista</button>';

  if(state._entryManualConfirm){
    html += '<div class="banner warn">Producto confirmado manualmente por descripción (el código escaneado <code>'+esc(state._entryScannedCode||"")+'</code> no coincidía). Esto queda registrado.</div>';
  }

  html += '<div class="card" style="margin-bottom:14px;">'+
    '<p class="eyebrow">Ref. '+esc(it.referencia)+' · '+esc(it.um)+'</p>'+
    '<h1 style="font-size:19px;margin-bottom:8px;">'+esc(it.descItem)+'</h1>'+
    '<div class="hint">Código de barras SIESA: <span class="mono">'+esc(it.barcode||"—")+'</span></div>'+
    '<div class="hint">Grupo Shopper: '+esc(it.grupoShopper||"—")+'</div>'+
  '</div>';

  html += '<div class="card" style="margin-bottom:14px;">'+
    '<h3 style="font-size:15px;margin-bottom:12px;">Registrar lote</h3>'+
    '<div class="field"><label>Cantidad (unidades)</label><input id="cantInput" type="number" min="0" step="0.01" placeholder="Ej: 12" value="'+esc(state._entryCantidad)+'"></div>'+
    '<div class="field"><label>Fecha de vencimiento</label><input id="fechaInput" type="date" value="'+esc(state._entryFecha)+'"><div class="hint">Si el producto ya está vencido físicamente, elige su fecha real aunque sea anterior a hoy.</div></div>'+
    '<button class="btn primary block" id="btnSaveLote">Guardar lote</button>'+
  '</div>';

  var regs = it.registros || [];
  html += '<div class="card">'+
    '<h3 style="font-size:15px;margin-bottom:10px;">Lotes registrados ('+regs.length+')</h3>';
  if(!regs.length){
    html += '<div class="hint">Aún no hay lotes registrados para esta referencia.</div>';
  } else {
    regs.forEach(function(r, idx){
      html += '<div class="lote-row"><span>'+fmtNum(r.cantidad,2)+' und · vence '+esc(r.fechaVenc)+'</span><button class="x" data-idx="'+idx+'">✕</button></div>';
    });
  }
  html += '<button class="btn block" id="btnDone" style="margin-top:12px;" '+(regs.length?"":"disabled")+'>Marcar referencia como contada ✓</button>';
  html += '</div>';

  html += '</div>';
  root.innerHTML = html;
  wireTopbar();

  root.querySelector("#backBtn").onclick = function(){ setState({view:"mine"}); };
  root.querySelector("#cantInput").oninput = function(e){ state._entryCantidad = e.target.value; };
  root.querySelector("#fechaInput").oninput = function(e){ state._entryFecha = e.target.value; };
  root.querySelector("#btnSaveLote").onclick = async function(){
    var cant = parseFloat(state._entryCantidad);
    var fecha = state._entryFecha;
    if(!cant || cant<=0){ await notify("Ingresa una cantidad válida."); return; }
    if(!fecha){ await notify("Elige una fecha de vencimiento."); return; }
    if(fecha < todayISO() && !(await askConfirm("La fecha "+fecha+" ya pasó. ¿Confirmas que este producto está físicamente vencido?"))){ return; }
    await Store.addRegistro(state.currentCargaId, it.id, {
      cantidad:cant, fechaVenc:fecha, capturadoPor:state.identity.id, capturadoEn:new Date().toISOString(),
      confirmadoManual: state._entryManualConfirm, codigoEscaneado: state._entryScannedCode
    });
    state._entryCantidad = ""; state._entryManualConfirm = false; state._entryScannedCode = null;
    render();
  };
  root.querySelectorAll(".lote-row .x").forEach(function(b){
    b.onclick = async function(){ await Store.removeRegistro(state.currentCargaId, it.id, parseInt(b.getAttribute("data-idx"),10)); render(); };
  });
  var doneBtn = root.querySelector("#btnDone");
  if(doneBtn) doneBtn.onclick = async function(){ await Store.finalizarItem(state.currentCargaId, it.id); setState({view:"mine"}); };
}

/* ================= main render dispatcher ================= */
function render(){
  if(!state.identity){ renderLogin(); return; }
  if(state.identity.rol === "administrador"){
    if(state.view==="detail" && state.currentCargaId) renderCoordinadorDetail();
    else if(state.adminTab==="usuarios") renderAdminPanel();
    else if(state.adminTab==="consolidado") renderConsolidado();
    else renderCoordinadorList();
  } else if(state.identity.rol === "coordinador"){
    if(state.view==="detail" && state.currentCargaId) renderCoordinadorDetail();
    else renderCoordinadorList();
  } else {
    if(state.view==="entry" && state.activeItemId) renderOperarioEntry();
    else if(state.view==="mine" && state.currentCargaId) renderOperarioMine();
    else renderOperarioHome();
  }
}

/* ================= boot ================= */
(async function boot(){
  root.innerHTML = '<div class="login-shell"><div class="hint">Cargando…</div></div>';
  await Store.init();
  state.syncMode = USE_DB ? "db" : "local";
  Store.onCargas(function(list){ setState({cargas:list}); });
  Store.onUsuarios(function(list){ setState({usuarios:list, usuariosListos:true}); });
})();

})();
</script>
