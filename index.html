<title>Semáforos de Vencimiento</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#FBF8F2;
  --surface:#FFFFFF;
  --surface-2:#F3ECDB;
  --surface-3:#E9DEC4;
  --border:#E7DCC1;
  --ink:#2E2618;
  --ink-soft:#6B5D4C;
  --muted:#9A8D78;
  --accent:#B99A63;
  --accent-strong:#9C7C47;
  --accent-bg:#F3E9D3;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(46,38,24,.05), 0 10px 28px -16px rgba(46,38,24,.18);
  --radius-sm:10px; --radius-md:16px; --radius-lg:22px; --radius-pill:999px;
  --green:#2E8B57; --green-bg:#E4F3EA;
  --amber:#B8860B; --amber-bg:#FBF1D9;
  --s-2:#E0AE1F; --s-3:#1E6B3E; --s-4:#8FCB7E; --s3-bg:#DDEFE3; --s4-bg:#EAF6E4; --s4-ink:#3F7A2E;
  --red:#C4453A; --red-bg:#FAE7E4;
  --critical:#7A2048; --critical-bg:#F5E2EA;
  --danger:#C4453A; --danger-bg:#FAE7E4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#17130E; --surface:#221C15; --surface-2:#2B241A; --surface-3:#362D20;
    --border:#463A28; --ink:#F5EFE2; --ink-soft:#D2C1A3; --muted:#A79980;
    --accent:#D2B378; --accent-strong:#E6C88F; --accent-bg:#332A1B; --on-accent:#241A0C;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 32px -18px rgba(0,0,0,.55);
    --green:#6FBB8B; --green-bg:#1B2B21; --amber:#E0BD63; --amber-bg:#332918;
    --s-2:#EBC13F; --s-3:#2F9A5C; --s-4:#A6DB95; --s3-bg:#18301F; --s4-bg:#1E2B1A; --s4-ink:#A6DB95;--red:#E5978C; --red-bg:#332019;
    --critical:#D391AE; --critical-bg:#2E1A24;
    --danger:#E5978C; --danger-bg:#332019;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#17130E; --surface:#221C15; --surface-2:#2B241A; --surface-3:#362D20;
  --border:#463A28; --ink:#F5EFE2; --ink-soft:#D2C1A3; --muted:#A79980;
  --accent:#D2B378; --accent-strong:#E6C88F; --accent-bg:#332A1B; --on-accent:#241A0C;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 32px -18px rgba(0,0,0,.55);
  --green:#6FBB8B; --green-bg:#1B2B21; --amber:#E0BD63; --amber-bg:#332918;
  --s-2:#EBC13F; --s-3:#2F9A5C; --s-4:#A6DB95; --s3-bg:#18301F; --s4-bg:#1E2B1A; --s4-ink:#A6DB95;--red:#E5978C; --red-bg:#332019;
  --critical:#D391AE; --critical-bg:#2E1A24;
  --danger:#E5978C; --danger-bg:#332019;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Plus Jakarta Sans",-apple-system,Segoe UI,sans-serif;
  font-size:15.5px;
  line-height:1.5;
}
h1,h2,h3{ font-family:"Quicksand","Plus Jakarta Sans",sans-serif; color:var(--ink); text-wrap:balance; margin:0; font-weight:700; }
code,.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;}
button, input, select{ font-family:inherit; font-size:inherit; color:inherit; }
input:focus-visible, button:focus-visible, select:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

#app{ min-height:100%; }

/* ---------- shell / topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 18px; background:var(--surface); border-bottom:1px solid var(--border);
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand .mark{ width:26px; height:38px; flex:0 0 auto; }
.brand b{ font-family:"Quicksand",sans-serif; font-size:17px; font-weight:700; }
.brand .sub{ font-size:11px; color:var(--muted); font-family:"IBM Plex Mono",monospace; letter-spacing:.04em; }
.who{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink-soft); }
.who .name{ color:var(--ink); font-weight:600; }
.who button{ background:none; border:1px solid var(--border); color:var(--ink-soft); border-radius:var(--radius-pill); padding:6px 14px; cursor:pointer; font-size:12.5px; }
.who button:hover{ border-color:var(--accent); color:var(--accent); }
#themeToggle{ padding:0; width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; font-size:15px; line-height:1; background:var(--surface-2); }

@media (max-width:640px){
  .topbar{ flex-wrap:wrap; padding:10px 12px; }
  .brand .sub{ display:none; }
  .who{ flex-wrap:wrap; justify-content:flex-end; margin-left:auto; gap:8px; }
}
.wrap{ max-width:1080px; margin:0 auto; padding:22px 18px 80px; }
.wrap.narrow{ max-width:480px; }

/* ---------- generic ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink);
  border-radius:var(--radius-pill); padding:10px 18px; font-weight:600; font-size:14px; cursor:pointer;
  box-shadow:var(--shadow);
}
.btn:hover{ border-color:var(--accent); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
.btn.ghost{ background:none; box-shadow:none; }
.btn.danger{ color:var(--danger); border-color:var(--danger-bg); }
.btn.danger:hover{ border-color:var(--danger); }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.sm{ padding:7px 14px; font-size:12.5px; }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow); }
.card + .card{ margin-top:16px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em; }
.field input, .field select{
  width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:var(--radius-md);
  background:var(--bg); color:var(--ink);
}
.hint{ font-size:12.5px; color:var(--muted); margin-top:4px; }

.pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; font-family:"IBM Plex Mono",monospace; white-space:nowrap; }
.pill.green{ background:var(--green-bg); color:var(--green); }
.pill.amber{ background:var(--amber-bg); color:var(--amber); }
.pill.dgreen{ background:var(--s3-bg); color:var(--s-3); }
.pill.lgreen{ background:var(--s4-bg); color:var(--s4-ink); }
.pill.red{ background:var(--red-bg); color:var(--red); }
.pill.critical{ background:var(--critical-bg); color:var(--critical); }
.pill.neutral{ background:var(--surface-2); color:var(--muted); border:1px solid var(--border); }
.pill.dot::before{ content:"●"; font-size:9px; }

.eyebrow{ font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:0 0 6px; }

.tablewrap{ overflow-x:auto; }
table{ border-collapse:collapse; width:100%; font-size:13.5px; }
th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
th{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600; white-space:nowrap; }
tr.sel{ background:var(--accent-bg); }
td.num{ font-variant-numeric:tabular-nums; font-family:"IBM Plex Mono",monospace; }

.empty{ text-align:center; padding:40px 20px; color:var(--muted); }

.tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--border); }
.tabs button{ background:none; border:none; padding:10px 4px; margin-right:14px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-size:14px; }
.tabs button.active{ color:var(--ink); border-color:var(--accent); }

.grid-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
.stat{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 18px; box-shadow:var(--shadow); }
.stat .n{ font-family:"IBM Plex Mono",monospace; font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
.stat .l{ font-size:12px; color:var(--muted); margin-top:2px; }

.modal-bg{ position:fixed; inset:0; background:rgba(42,34,20,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
@media (min-width:640px){ .modal-bg{ align-items:center; } }
.modal{ background:var(--surface); border:1px solid var(--border); border-radius:24px 24px 0 0; padding:24px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; box-shadow:0 -8px 30px rgba(46,38,24,.2); }
@media (min-width:640px){ .modal{ border-radius:24px; } }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.modal-head button{ background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer; line-height:1; }

.banner{ border-left:3px solid var(--accent); background:var(--accent-bg); border-radius:0 var(--radius-md) var(--radius-md) 0; padding:12px 16px; font-size:13.5px; margin-bottom:16px; }
.banner.warn{ border-color:var(--amber); background:var(--amber-bg); }
/* ---------- informe de semáforo ---------- */
.bg-v{ background:var(--critical); } .bg-1{ background:var(--red); } .bg-2{ background:var(--s-2); } .bg-3{ background:var(--s-3); } .bg-4{ background:var(--s-4); }
.ix-bar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
.ix-bar input, .ix-bar select{ padding:9px 12px; border:1.5px solid var(--border); border-radius:var(--radius-md); background:var(--surface); min-width:0; }
.ix-bar .grow{ flex:1 1 180px; max-width:320px; }
.ix-chip{ display:inline-flex; gap:6px; align-items:center; border:1px solid var(--accent); border-radius:999px; padding:3px 4px 3px 12px; font-size:13px; background:var(--surface); }
.ix-chip button{ background:none; border:0; cursor:pointer; color:var(--ink-soft); font-size:16px; line-height:1; padding:2px 6px; }
.kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px; margin-bottom:18px; }
.kpi{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 16px; box-shadow:var(--shadow); min-width:0; }
.kpi .l{ font-size:12.5px; font-weight:700; color:var(--muted); }
.kpi .v{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2; overflow-wrap:anywhere; }
.kpi .n{ font-size:12px; color:var(--muted); min-height:1.2em; }
.kpi.crit{ border-top:3px solid var(--critical); } .kpi.risk{ border-top:3px solid var(--red); } .kpi.warn{ border-top:3px solid var(--s-2); }
.ix-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr)); gap:16px; margin-bottom:16px; }
.ix-grid > .card, .card.ix{ margin-top:0; display:flex; flex-direction:column; gap:12px; min-width:0; }
.card .hd h3{ font-size:16px; } .card .hd p{ margin:2px 0 0; color:var(--muted); font-size:12.5px; }
.band-row{ display:grid; grid-template-columns:130px 1fr auto; gap:12px; align-items:center; padding:8px 10px; border-radius:12px; border:1px solid transparent; background:transparent; width:100%; text-align:left; cursor:pointer; color:inherit; }
.band-row:hover{ background:var(--surface-2); }
.band-row[aria-pressed=true]{ border-color:var(--accent); background:var(--surface-2); }
.band-row .nm{ display:flex; gap:8px; align-items:center; font-weight:600; font-size:13px; }
.dotc{ width:10px; height:10px; border-radius:50%; flex:none; display:inline-block; }
.bar-track{ height:12px; background:var(--surface-3); border-radius:999px; position:relative; display:flex; overflow:hidden; }
.bar-seg{ height:100%; min-width:0; }
.band-row .num{ text-align:right; font-variant-numeric:tabular-nums; font-size:13px; line-height:1.25; }
.band-row .num b{ display:block; } .band-row .num span{ color:var(--muted); font-size:12px; }
.seg{ display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; align-self:flex-start; }
.seg button{ background:transparent; border:0; padding:6px 14px; cursor:pointer; color:var(--ink-soft); }
.seg button[aria-pressed=true]{ background:var(--accent); color:var(--on-accent); font-weight:700; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--ink-soft); }
.legend span{ display:inline-flex; gap:6px; align-items:center; }
.alerts, .top10{ display:flex; flex-direction:column; gap:8px; margin:0; padding:0; list-style:none; }
.alert{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-left:4px solid var(--red); border-radius:12px; background:var(--bg); min-width:0; }
.alert.venc{ border-left-color:var(--critical); }
.alert .t b{ display:block; overflow-wrap:anywhere; } .alert .t span{ color:var(--muted); font-size:12.5px; }
.alert .m{ font-weight:800; font-size:16px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.t10{ display:grid; grid-template-columns:28px 1fr; gap:10px; padding:8px 4px; border-bottom:1px solid var(--border); align-items:start; }
.t10:last-child{ border-bottom:0; }
.t10 .rk{ font-family:"Quicksand",sans-serif; font-weight:700; font-size:24px; color:var(--accent-strong); line-height:1; }
.t10 .meta{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12.5px; color:var(--muted); margin-top:2px; align-items:center; }
.t10 .val{ font-variant-numeric:tabular-nums; font-weight:700; margin-left:auto; color:var(--ink); }
.t10 .bar{ height:7px; background:var(--surface-3); border-radius:999px; margin-top:6px; position:relative; }
.t10 .bar i{ position:absolute; left:0; top:0; bottom:0; border-radius:999px; }
.note{ font-size:12px; color:var(--muted); margin:0; }
.ix-table{ overflow:auto; max-height:560px; border-radius:var(--radius-md); }
.ix-table table{ min-width:860px; }
.ix-table th{ position:sticky; top:0; background:var(--surface-2); cursor:pointer; user-select:none; }
.ix-table th[aria-sort=ascending]::after{ content:" ▲"; font-size:10px; } .ix-table th[aria-sort=descending]::after{ content:" ▼"; font-size:10px; }
@media (max-width:560px){ .band-row{ grid-template-columns:1fr auto; } .band-row .bar-track{ grid-column:1/-1; order:3; } .alert{ grid-template-columns:1fr auto; } .alert .pill{ grid-column:1/-1; } }

/* ---------- login ---------- */
.login-shell{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.login-card{ width:100%; max-width:400px; }
.login-card .mark-big{ width:44px; height:66px; margin-bottom:16px; }
.role-choice{ display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px; margin-bottom:16px; }
.role-btn{ border:1.5px solid var(--border); background:var(--surface); border-radius:var(--radius-md); padding:15px 10px; text-align:center; cursor:pointer; }
.role-btn b{ display:block; font-size:14px; margin-bottom:2px; }
.role-btn span{ font-size:11.5px; color:var(--muted); }
.role-btn.sel{ border-color:var(--accent); background:var(--accent-bg); }

/* ---------- operario product list ---------- */
.item-row{ display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); margin-bottom:9px; cursor:pointer; }
.item-row:hover{ border-color:var(--accent); }
.item-row .ico{ width:36px; height:36px; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:0 0 auto; font-size:14px; }
.item-row .info{ flex:1; min-width:0; }
.item-row .info .t{ font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-row .info .m{ font-size:12px; color:var(--muted); font-family:"IBM Plex Mono",monospace; }

.searchbar{ position:relative; margin-bottom:14px; }
.searchbar input{ width:100%; padding:13px 16px; border:1.5px solid var(--border); border-radius:var(--radius-md); background:var(--surface); }

.scan-btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:15px; border-radius:var(--radius-pill); background:var(--accent); color:var(--on-accent); border:none; font-weight:700; font-size:15px; cursor:pointer; margin-bottom:14px; box-shadow:var(--shadow); }
.scan-btn:hover{ background:var(--accent-strong); }

.video-wrap{ position:relative; border-radius:var(--radius-lg); overflow:hidden; background:#000; margin-bottom:12px; aspect-ratio:4/3; }
.video-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
.video-wrap .frame{ position:absolute; inset:14%; border:2px solid #ffffffaa; border-radius:16px; pointer-events:none; overflow:hidden; }
.video-wrap .frame .laser{ position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, #ff4d4d 15%, #ff4d4d 85%, transparent); box-shadow:0 0 6px 1px rgba(255,77,77,.8); animation:laserSweep 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .video-wrap .frame .laser{ animation:none; top:50%; } }
@keyframes laserSweep{ 0%{ top:6%; } 50%{ top:94%; } 100%{ top:6%; } }

.lote-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; background:var(--surface-2); border-radius:var(--radius-md); margin-bottom:7px; font-size:13.5px; }
.lote-row .x{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; }

.progress-bar{ height:8px; border-radius:var(--radius-pill); background:var(--surface-3); overflow:hidden; }
.progress-bar > div{ height:100%; background:var(--accent); border-radius:var(--radius-pill); }

.assign-check{ display:flex; align-items:center; gap:8px; }
.assign-check input{ width:16px; height:16px; }

.footer-note{ text-align:center; font-size:12px; color:var(--muted); margin-top:30px; }
.qr-box{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px 0; }
.qr-box #qrcanvas{ background:#fff; padding:14px; border-radius:var(--radius-md); }
</style>

<script>
(function(){
"use strict";

/* ================= utils ================= */
function fmtNum(n, d){ if(n==null||isNaN(n)) return "—"; d=d==null?2:d; return Number(n).toLocaleString("es-CO",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtMoney(n){ if(n==null||isNaN(n)) return "—"; return "$" + Math.round(n).toLocaleString("es-CO"); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function fmtFecha(iso){ var p=String(iso||"").split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : (iso||""); }
function diasEntre(fechaVenc, refISO){
  return Math.round((new Date(fechaVenc+"T00:00:00") - new Date(refISO+"T00:00:00"))/86400000);
}
/* Semáforo según el informe vigente: 1-30 rojo, 31-60 amarillo, 61-90 verde oscuro, >90 verde claro.
   "Vencido" (días <= 0) se conserva aquí porque la app es donde se detecta en el conteo físico. */
var BANDAS = [
  {id:"vencido", n:"Vencido",          cls:"critical", bg:"bg-v", w:1},
  {id:"b1",      n:"De 1 a 30 días",   cls:"red",      bg:"bg-1", w:1},
  {id:"b2",      n:"De 31 a 60 días",  cls:"amber",    bg:"bg-2", w:.6},
  {id:"b3",      n:"De 61 a 90 días",  cls:"dgreen",   bg:"bg-3", w:.3},
  {id:"b4",      n:"Más de 90 días",   cls:"lgreen",   bg:"bg-4", w:0}
];
var BANDA_POR_ID = {}; BANDAS.forEach(function(b){ BANDA_POR_ID[b.id] = b; });
function bandaDe(dias){ return dias<=0?"vencido":dias<=30?"b1":dias<=60?"b2":dias<=90?"b3":"b4"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* ---- ciudades, roles y usuarios ----
   Cada usuario es un documento en "usuarios" con id "<C.O.>-<nombre-normalizado>" y campos
   nombre, cargo, co, ciudad, rol (administrador | coordinador | operario), activo.
   "coordinador" incluye supervisores; "operario" es el auxiliar de bodega. */
var CIUDADES = [
  {co:"006", nombre:"Pereira",   bodegaPref:"06", scan:"lector"},
  {co:"007", nombre:"Armenia",   bodegaPref:"07", scan:"camara"},
  {co:"008", nombre:"Manizales", bodegaPref:"08", scan:"camara"},
  {co:"012", nombre:"Ibagué",    bodegaPref:"12", scan:"camara"},
  {co:"018", nombre:"Neiva",     bodegaPref:"18", scan:"camara"}
];
var REGIONAL = {co:"REG", nombre:"Eje Cafetero"};
var ROL_LABEL = {administrador:"Administrador", coordinador:"Coordinador / Supervisor", operario:"Auxiliar de bodega"};
function ciudadPorCo(co){ return CIUDADES.filter(function(c){ return c.co===co; })[0] || null; }
function ciudadPorNombre(n){ return CIUDADES.filter(function(c){ return c.nombre===n; })[0] || null; }
function ciudadPorBodega(bodega){ var p = String(bodega||"").slice(0,2); return CIUDADES.filter(function(c){ return c.bodegaPref===p; })[0] || null; }
function slugNombre(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function userId(co, nombre){ return co+"-"+slugNombre(nombre); }
function primerNombre(n){ return String(n||"").trim().split(/\s+/)[0]||""; }
function nombreDe(id){
  if(!id) return "";
  var u = (state.usuarios||[]).filter(function(x){ return x.id===id; })[0];
  return u && u.nombre ? u.nombre : id;
}
function usuariosDeCiudad(ciudad, soloRol){
  return (state.usuarios||[]).filter(function(u){
    return u.activo!==false && u.ciudad===ciudad && (!soloRol || u.rol===soloRol);
  }).sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre)); });
}
/* Cargas que el usuario actual puede ver: el administrador ve todas (con filtro opcional); los demás, solo las de su ciudad. */
function cargasVisibles(){
  var id = state.identity; if(!id) return [];
  if(id.rol==="administrador") return state.cargas.filter(function(c){ return !state._filtroCiudad || c.ciudad===state._filtroCiudad; });
  return state.cargas.filter(function(c){ return c.ciudad===id.ciudad; });
}
function debounce(fn, ms){ var t; return function(){ var a=arguments,c=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(c,a); }, ms); }; }

/* ================= custom dialogs =================
   The page is hosted inside Claude's own viewer chrome (an iframe), which
   does not grant native window.alert/confirm/prompt — those calls silently
   no-op there (confirm/prompt resolve false/null with no dialog ever shown,
   alert does nothing), which is why destructive actions gated by confirm()
   used to appear to "do nothing" with no error. These DOM-based modals use
   the same .modal-bg/.modal markup as the rest of the app instead. */
function notify(message){
  return new Promise(function(resolve){
    var m = document.createElement("div");
    m.className = "modal-bg";
    m.innerHTML = '<div class="modal" style="max-width:380px;">'+
      '<p style="margin-bottom:18px;">'+esc(message)+'</p>'+
      '<div style="display:flex;justify-content:flex-end;"><button class="btn primary" id="ntOk">Entendido</button></div>'+
    '</div>';
    document.body.appendChild(m);
    function close(){ m.remove(); resolve(); }
    m.querySelector("#ntOk").onclick = close;
    m.onclick = function(e){ if(e.target===m) close(); };
  });
}
function askConfirm(message){
  return new Promise(function(resolve){
    var m = document.createElement("div");
    m.className = "modal-bg";
    m.innerHTML = '<div class="modal" style="max-width:380px;">'+
      '<p style="margin-bottom:18px;">'+esc(message)+'</p>'+
      '<div style="display:flex;gap:10px;justify-content:flex-end;">'+
        '<button class="btn" id="cnCancel">Cancelar</button>'+
        '<button class="btn danger" id="cnOk">Confirmar</button>'+
      '</div>'+
    '</div>';
    document.body.appendChild(m);
    function close(v){ m.remove(); resolve(v); }
    m.querySelector("#cnCancel").onclick = function(){ close(false); };
    m.querySelector("#cnOk").onclick = function(){ close(true); };
    m.onclick = function(e){ if(e.target===m) close(false); };
  });
}
function askPrompt(message, defaultValue){
  return new Promise(function(resolve){
    var m = document.createElement("div");
    m.className = "modal-bg";
    m.innerHTML = '<div class="modal" style="max-width:380px;">'+
      '<p style="margin-bottom:10px;">'+esc(message)+'</p>'+
      '<div class="field"><input id="pmInput" value="'+esc(defaultValue||"")+'"></div>'+
      '<div style="display:flex;gap:10px;justify-content:flex-end;">'+
        '<button class="btn" id="pmCancel">Cancelar</button>'+
        '<button class="btn primary" id="pmOk">Aceptar</button>'+
      '</div>'+
    '</div>';
    document.body.appendChild(m);
    function close(v){ m.remove(); resolve(v); }
    m.querySelector("#pmCancel").onclick = function(){ close(null); };
    m.querySelector("#pmOk").onclick = function(){ close(m.querySelector("#pmInput").value); };
    m.querySelector("#pmInput").onkeydown = function(e){ if(e.key==="Enter") close(m.querySelector("#pmInput").value); };
    m.onclick = function(e){ if(e.target===m) close(null); };
    m.querySelector("#pmInput").focus();
  });
}

var USE_DB = false, dbNs = null, DB_BATCH = 1;
var LS_KEY = "semaforos_demo_state_v1";
var LS_AVAILABLE = true;
try{ localStorage.setItem(LS_KEY+"__t","1"); localStorage.removeItem(LS_KEY+"__t"); }catch(e){ LS_AVAILABLE = false; }
var memState = {};

function lsRead(){
  if(!LS_AVAILABLE) return memState;
  try{ return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); }catch(e){ return memState; }
}
function lsWrite(state){
  if(LS_AVAILABLE){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ LS_AVAILABLE=false; memState=state; } }
  else { memState = state; }
  lsListeners.forEach(function(fn){ fn(); });
}
var lsListeners = [];

/* ================= Supabase (REST) =================
   Misma interfaz que usa la app con el db de Claude (doc/collection/get/set/update/delete/onSnapshot).
   Los cambios se detectan consultando cada 4 s una marca liviana (último cambio + conteo). */
var SUPABASE_URL = "https://fbivjzmvtyxvtiovsskk.supabase.co", SUPABASE_KEY = "sb_publishable_zKpd8ztloRQKL_bm8pa1IA_fD_eJLkz";
function makeSupabaseDb(){
  var base = SUPABASE_URL.replace(/\/+$/,"") + "/rest/v1/";
  var H = {apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY, "Content-Type":"application/json"};
  function eq(v){ return "eq."+encodeURIComponent(v); }
  async function call(method, path, body, extra){
    var res = await fetch(base+path, {method:method, headers:Object.assign({}, H, extra||{}), body: body==null?undefined:JSON.stringify(body)});
    if(!res.ok){ var t=""; try{ t = await res.text(); }catch(e){} throw new Error("Supabase "+res.status+": "+t.slice(0,200)); }
    return res;
  }
  async function json(method, path, body, extra){
    var res = await call(method, path, body, extra); var txt = await res.text(); return txt ? JSON.parse(txt) : null;
  }
  function splitPath(p){ var i = p.lastIndexOf("/"); return {col:p.slice(0,i), id:p.slice(i+1)}; }
  function snapDoc(id, datos){ return {id:id, exists:datos!=null, data:function(){ return datos; }}; }
  var listeners = [];
  function refreshAll(){ listeners.forEach(function(l){ l.poll(); }); }
  return {
    ping: function(){ return json("GET", "documentos?select=id&limit=1"); },
    rpc: function(nombre, args){ return json("POST", "rpc/"+nombre, args); },
    doc: function(path){
      var p = splitPath(path), q = "documentos?coleccion="+eq(p.col)+"&id="+eq(p.id);
      return {
        get: async function(){ var r = await json("GET", q+"&select=datos"); return snapDoc(p.id, r.length ? r[0].datos : null); },
        set: async function(data){
          await call("POST", "documentos?on_conflict=coleccion,id", {coleccion:p.col, id:p.id, datos:data, actualizado:new Date().toISOString()}, {Prefer:"resolution=merge-duplicates,return=minimal"});
          refreshAll();
        },
        update: async function(data){ await call("POST", "rpc/actualizar_documento", {p_coleccion:p.col, p_id:p.id, p_cambios:data}); refreshAll(); },
        delete: async function(){ await call("DELETE", q, null, {Prefer:"return=minimal"}); refreshAll(); }
      };
    },
    collection: function(path){
      var order = null;
      function makeSnap(rows){
        var list = rows.slice();
        if(order) list.sort(function(a,b){
          var x = (a.datos||{})[order.field], y = (b.datos||{})[order.field];
          return ((x<y?-1:x>y?1:0)) * (order.dir==="desc"?-1:1);
        });
        return {docs: list.map(function(r){ return snapDoc(r.id, r.datos); })};
      }
      function fetchAll(){ return json("GET", "documentos?coleccion="+eq(path)+"&select=id,datos&order=id.asc"); }
      async function marca(){
        var res = await call("GET", "documentos?coleccion="+eq(path)+"&select=actualizado&order=actualizado.desc&limit=1", null, {Prefer:"count=exact"});
        var rows = JSON.parse(await res.text() || "[]");
        return (rows.length?rows[0].actualizado:"")+"|"+(res.headers.get("content-range")||"");
      }
      var c = {
        orderBy: function(field, dir){ order = {field:field, dir:dir||"asc"}; return c; },
        get: async function(){ return makeSnap(await fetchAll()); },
        onSnapshot: function(cb, errCb){
          var lastMarca = null, stopped = false, busy = false;
          async function poll(){
            if(stopped || busy) return; busy = true;
            try{
              var m = await marca();
              if(m !== lastMarca){ var rows = await fetchAll(); if(!stopped){ lastMarca = m; cb(makeSnap(rows)); } }
            }catch(e){ if(errCb && lastMarca===null){ lastMarca = ""; errCb(e); } }
            busy = false;
          }
          var l = {poll:poll}; listeners.push(l); poll();
          var t = setInterval(poll, 4000);
          return function(){ stopped = true; clearInterval(t); listeners = listeners.filter(function(x){ return x!==l; }); };
        }
      };
      return c;
    }
  };
}
async function inBatches(list, n, fn){
  for(var i=0;i<list.length;i+=n){ await Promise.all(list.slice(i,i+n).map(fn)); }
}

var Store = {
  async init(){
    try{
      if(window.claude && window.claude.use){
        var d = await window.claude.use("db");
        if(d){ dbNs = d; USE_DB = true; }
      }
    }catch(e){ USE_DB = false; }
    if(!USE_DB && SUPABASE_URL && SUPABASE_KEY){
      try{ var sb = makeSupabaseDb(); await sb.ping(); dbNs = sb; USE_DB = true; DB_BATCH = 8; }catch(e){ USE_DB = false; }
    }
  },

  onCargas(cb){
    if(USE_DB){
      return dbNs.collection("cargas").orderBy("creadoEn","desc").onSnapshot(function(snap){
        cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
      }, function(){ cb([]); });
    } else {
      function push(){ var s=lsRead(); var list=Object.keys(s.cargas||{}).map(function(id){ return Object.assign({id:id}, s.cargas[id].meta); }); list.sort(function(a,b){ return (b.creadoEn||"").localeCompare(a.creadoEn||""); }); cb(list); }
      lsListeners.push(push); push();
      return function(){ lsListeners = lsListeners.filter(function(f){return f!==push;}); };
    }
  },

  onItems(cargaId, cb){
    if(USE_DB){
      return dbNs.collection("cargas/"+cargaId+"/items").onSnapshot(function(snap){
        cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
      }, function(){ cb([]); });
    } else {
      function push(){ var s=lsRead(); var c=(s.cargas||{})[cargaId]; var items=c?Object.keys(c.items||{}).map(function(id){ return Object.assign({id:id}, c.items[id]); }):[]; cb(items); }
      lsListeners.push(push); push();
      return function(){ lsListeners = lsListeners.filter(function(f){return f!==push;}); };
    }
  },

  async createCarga(meta, items, explicitId){
    var cargaId = explicitId || ("carga-" + uid());
    meta = Object.assign({creadoEn: new Date().toISOString(), operarios:[]}, meta);
    if(USE_DB){
      await dbNs.doc("cargas/"+cargaId).set(meta);
      await inBatches(items, DB_BATCH, function(it){
        return dbNs.doc("cargas/"+cargaId+"/items/"+it.referencia).set(Object.assign({estado:"pendiente", asignadoA:null, registros:[]}, it));
      });
    } else {
      var s = lsRead(); s.cargas = s.cargas||{};
      var itemsMap = {};
      items.forEach(function(it){ itemsMap[it.referencia] = Object.assign({estado:"pendiente", asignadoA:null, registros:[]}, it); });
      s.cargas[cargaId] = {meta: meta, items: itemsMap};
      lsWrite(s);
    }
    return cargaId;
  },

  async deleteCarga(cargaId){
    if(USE_DB){
      var snap = await dbNs.collection("cargas/"+cargaId+"/items").get();
      await inBatches(snap.docs, DB_BATCH, function(d){
        return dbNs.doc("cargas/"+cargaId+"/items/"+d.id).delete();
      });
      await dbNs.doc("cargas/"+cargaId).delete();
    } else {
      var s = lsRead();
      if(s.cargas) delete s.cargas[cargaId];
      lsWrite(s);
    }
  },

  async resetCarga(cargaId){
    if(USE_DB){
      var snap = await dbNs.collection("cargas/"+cargaId+"/items").get();
      await inBatches(snap.docs, DB_BATCH, function(d){
        return dbNs.doc("cargas/"+cargaId+"/items/"+d.id).update({estado:"pendiente", asignadoA:null, registros:[]});
      });
      await dbNs.doc("cargas/"+cargaId).update({operarios:[]});
    } else {
      var s = lsRead(); var c = s.cargas[cargaId]; if(!c) return;
      Object.keys(c.items).forEach(function(ref){ c.items[ref].estado="pendiente"; c.items[ref].asignadoA=null; c.items[ref].registros=[]; });
      c.meta.operarios = [];
      lsWrite(s);
    }
  },

  async assignItems(cargaId, itemIds, operario){
    if(USE_DB){
      await inBatches(itemIds, DB_BATCH, function(id){
        return dbNs.doc("cargas/"+cargaId+"/items/"+id).update({asignadoA:operario});
      });
      var cdoc = await dbNs.doc("cargas/"+cargaId).get();
      var ops = (cdoc.data()||{}).operarios || [];
      if(ops.indexOf(operario)===-1){ ops = ops.concat([operario]); await dbNs.doc("cargas/"+cargaId).update({operarios:ops}); }
    } else {
      var s = lsRead(); var c = s.cargas[cargaId];
      itemIds.forEach(function(id){ if(c.items[id]) c.items[id].asignadoA = operario; });
      c.meta.operarios = c.meta.operarios || [];
      if(c.meta.operarios.indexOf(operario)===-1) c.meta.operarios.push(operario);
      lsWrite(s);
    }
  },

  async addRegistro(cargaId, itemId, registro){
    if(USE_DB){
      var doc = await dbNs.doc("cargas/"+cargaId+"/items/"+itemId).get();
      var data = doc.data() || {};
      var regs = (data.registros||[]).concat([registro]);
      await dbNs.doc("cargas/"+cargaId+"/items/"+itemId).update({registros:regs, estado:"en_progreso"});
    } else {
      var s = lsRead(); var it = s.cargas[cargaId].items[itemId];
      it.registros = (it.registros||[]).concat([registro]);
      it.estado = "en_progreso";
      lsWrite(s);
    }
  },

  async removeRegistro(cargaId, itemId, idx){
    if(USE_DB){
      var doc = await dbNs.doc("cargas/"+cargaId+"/items/"+itemId).get();
      var data = doc.data() || {};
      var regs = (data.registros||[]).slice(); regs.splice(idx,1);
      await dbNs.doc("cargas/"+cargaId+"/items/"+itemId).update({registros:regs, estado: regs.length?"en_progreso":"pendiente"});
    } else {
      var s = lsRead(); var it = s.cargas[cargaId].items[itemId];
      it.registros.splice(idx,1);
      it.estado = it.registros.length?"en_progreso":"pendiente";
      lsWrite(s);
    }
  },

  async getItems(cargaId){
    if(USE_DB){
      var snap = await dbNs.collection("cargas/"+cargaId+"/items").get();
      return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    }
    var s = lsRead(), c = (s.cargas||{})[cargaId];
    return c ? Object.keys(c.items||{}).map(function(id){ return Object.assign({id:id}, c.items[id]); }) : [];
  },

  async finalizarItem(cargaId, itemId){
    if(USE_DB){ await dbNs.doc("cargas/"+cargaId+"/items/"+itemId).update({estado:"finalizado"}); }
    else { var s=lsRead(); s.cargas[cargaId].items[itemId].estado="finalizado"; lsWrite(s); }
  },

  onUsuarios(cb){
    if(USE_DB){
      return dbNs.collection("usuarios").onSnapshot(function(snap){
        cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
      }, function(){ cb([]); });
    } else {
      function push(){ var s=lsRead(); var list=Object.keys(s.usuarios||{}).map(function(id){ return Object.assign({id:id}, s.usuarios[id]); }); cb(list); }
      lsListeners.push(push); push();
      return function(){ lsListeners = lsListeners.filter(function(f){return f!==push;}); };
    }
  },

  /* Clave del administrador: se verifica en el servidor (Supabase) y nunca viaja ni se guarda en el código.
     Si no hay Supabase (modo local o Claude), no hay dónde verificarla y se entra solo por nombre. */
  tieneClaves(){ return !!(USE_DB && dbNs && dbNs.rpc); },
  async verificarClave(usuario, clave){ return (await dbNs.rpc("verificar_clave", {p_usuario:usuario, p_clave:clave})) === true; },

  async upsertUsuario(id, data){
    var body = Object.assign({activo:true, actualizadoEn:new Date().toISOString()}, data);
    if(USE_DB){
      await dbNs.doc("usuarios/"+id).set(body);
    } else {
      var s = lsRead(); s.usuarios = s.usuarios||{};
      s.usuarios[id] = Object.assign({}, s.usuarios[id], body);
      lsWrite(s);
    }
  },

  async setUsuarioActivo(id, activo){
    if(USE_DB){ await dbNs.doc("usuarios/"+id).update({activo:activo}); }
    else { var s=lsRead(); if(s.usuarios && s.usuarios[id]){ s.usuarios[id].activo = activo; lsWrite(s); } }
  },

  async deleteUsuario(id){
    if(USE_DB){ await dbNs.doc("usuarios/"+id).delete(); }
    else { var s=lsRead(); if(s.usuarios) delete s.usuarios[id]; lsWrite(s); }
  }
};

/* ================= theme (defaults to light, ignores OS/browser dark
   mode preference — the app decides its own look; the toggle lets a
   viewer opt into dark manually, remembered on this device) ========== */
var THEME_KEY = "semaforos_theme_v1";
function getTheme(){ try{ return localStorage.getItem(THEME_KEY) || "light"; }catch(e){ return "light"; } }
function setTheme(t){
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  document.documentElement.setAttribute("data-theme", t);
}
function toggleTheme(){ setTheme(getTheme()==="dark" ? "light" : "dark"); render(); }
setTheme(getTheme());

/* ================= identity (simulated M365 login) =================
   Uses sessionStorage (per-tab), not localStorage (shared by every tab of
   this origin) — so each browser tab can be logged in as a different
   role/user at the same time, e.g. one tab as coordinador and another as
   operario, without one login overwriting the other. The trade-off: the
   identity is forgotten when that tab is closed, not remembered forever. */
var IDENTITY_KEY = "semaforos_identity_v1";
var memIdentity = null;
function getIdentity(){ try{ return JSON.parse(sessionStorage.getItem(IDENTITY_KEY)); }catch(e){ return memIdentity; } }
function setIdentity(v){ memIdentity = v; try{ sessionStorage.setItem(IDENTITY_KEY, JSON.stringify(v)); }catch(e){} }
function clearIdentity(){ memIdentity = null; try{ sessionStorage.removeItem(IDENTITY_KEY); }catch(e){} }

    if(p && (p==="REG" || ciudadPorCo(p))) return p;
  }catch(e){}
  return null;

function rolOrden(r){ return r==="administrador" ? 0 : r==="coordinador" ? 1 : 2; }

function loginComo(u){
  if(u.activo===false){ notify("Tu usuario está desactivado. Contacta al administrador."); return; }
  var identity = {id:u.id, nombre:u.nombre, rol:u.rol, ciudad:u.ciudad, co:u.co};
  setIdentity(identity);
  setState({identity:identity, view: u.rol==="operario"?"home":"list", adminTab:"consolidado", currentCargaId:null, _consol:null});
}

function renderLogin(){

/* Importa el listado de personal desde un Excel (columnas: C.O, Operación, Nombres, Cargo).
   Lo ejecuta el administrador; solo agrega usuarios nuevos, no toca los existentes. */
function tituloNombre(s){ return String(s||"").trim().toLowerCase().replace(/(^|\s)\S/g, function(c){ return c.toUpperCase(); }); }
function rolPorCargo(cargo){
  var c = String(cargo||"").toUpperCase();
  if(c.indexOf("LIDER")>-1 || c.indexOf("LÍDER")>-1) return "administrador";
  if(c.indexOf("COORDINADOR")>-1 || c.indexOf("SUPERVISOR")>-1) return "coordinador";
  return "operario";
}
function showImportUsuarios(existentes){
  var m = document.createElement("div");
  m.className = "modal-bg";
  m.innerHTML = '<div class="modal" style="max-width:640px;">'+
    '<div class="modal-head"><h2 style="font-size:17px;">Importar usuarios desde Excel</h2><button id="imClose">×</button></div>'+
    '<p class="hint" style="margin-bottom:10px;">El archivo debe tener las columnas <b>C.O</b>, <b>Operación</b>, <b>Nombres</b> y <b>Cargo</b>. El rol se deduce del cargo: Auxiliar → auxiliar de bodega; Coordinador o Supervisor → coordinador/supervisor; Líder → administrador. Se agregan solo los usuarios que no existan; revisa la vista previa antes de confirmar.</p>'+
    '<div class="field"><input type="file" id="imFile" accept=".xlsx,.xls"></div>'+
    '<div id="imPreview" style="max-height:320px;overflow:auto;"></div>'+
    '<button class="btn primary block" id="imOk" disabled style="margin-top:12px;">Importar</button>'+
  '</div>';
  document.body.appendChild(m);
  var nuevos = [];
  m.querySelector("#imClose").onclick = function(){ m.remove(); };
  m.onclick = function(e){ if(e.target===m) m.remove(); };
  m.querySelector("#imFile").onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var box = m.querySelector("#imPreview");
      try{
        var wb = XLSX.read(ev.target.result, {type:"array"});
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
        var ids = {}; existentes.forEach(function(u){ ids[u.id] = true; });
        var lista = [];
        rows.forEach(function(r){
          var coRaw = String(r["C.O"]!==undefined ? r["C.O"] : r["C.O."]).trim();
          var co = /^\d+$/.test(coRaw) ? ("000"+coRaw).slice(-3) : (coRaw.toLowerCase()==="regional" ? "REG" : coRaw);
          var nombre = tituloNombre(r["Nombres"]);
          if(!nombre || !(co==="REG" || ciudadPorCo(co))) return;
          var ciudad = co==="REG" ? REGIONAL.nombre : ciudadPorCo(co).nombre;
          var cargo = String(r["Cargo"]||"").trim(); cargo = cargo.charAt(0).toUpperCase()+cargo.slice(1).toLowerCase();
          var id = userId(co, nombre);
          lista.push({id:id, nombre:nombre, cargo:cargo, co:co, ciudad:ciudad, rol:rolPorCargo(r["Cargo"]), activo:true, existe:!!ids[id]});
        });
        nuevos = lista.filter(function(u){ return !u.existe; });
        box.innerHTML = lista.length ? '<table><thead><tr><th>Nombre</th><th>Ciudad</th><th>Cargo</th><th>Rol</th><th></th></tr></thead><tbody>'+
          lista.map(function(u){ return '<tr><td>'+esc(u.nombre)+'</td><td>'+esc(u.ciudad)+'</td><td>'+esc(u.cargo)+'</td><td>'+esc(ROL_LABEL[u.rol])+'</td><td>'+(u.existe?'<span class="pill neutral">Ya existe</span>':'<span class="pill green">Nuevo</span>')+'</td></tr>'; }).join("")+'</tbody></table>'
          : '<p class="hint">No se encontraron filas válidas. Revisa los nombres de las columnas.</p>';
        var btn = m.querySelector("#imOk"); btn.disabled = !nuevos.length; btn.textContent = nuevos.length ? "Importar "+nuevos.length+" usuarios nuevos" : "No hay usuarios nuevos";
      }catch(err){ box.innerHTML = '<p style="color:var(--danger);">No se pudo leer el archivo: '+esc(err.message||err)+'</p>'; }
    };
    reader.readAsArrayBuffer(f);
  };
  m.querySelector("#imOk").onclick = async function(){
    try{
      for(var i=0;i<nuevos.length;i++){ var u = nuevos[i]; var id = u.id; var d = Object.assign({}, u); delete d.id; delete d.existe; await Store.upsertUsuario(id, d); }
      m.remove(); await notify("Se importaron "+nuevos.length+" usuarios."); render();
    }catch(err){ await notify("No se pudo importar: "+(err&&err.message?err.message:err)); }
  };
}

/* Informe consolidado: junta los lotes de todas las cargas (todas las ciudades) y reutiliza el informe de semáforo. */
async function cargarConsolidado(){
  state._consol = Object.assign({items:null}, state._consol, {cargando:true});
  var all = [];
  try{
    for(var i=0;i<state.cargas.length;i++){
      var c = state.cargas[i], items = await Store.getItems(c.id);
      items.forEach(function(it){ it._ciudad = c.ciudad||"Sin ciudad"; });
      all = all.concat(items);
    }
    state._consol = {items:all, cargando:false, ts:Date.now()};
  }catch(err){
    state._consol = {items:state._consol.items||[], cargando:false, error:(err&&err.message?err.message:String(err)), ts:Date.now()};
  }
  if(state.identity && state.identity.rol==="administrador" && state.adminTab==="consolidado" && state.view!=="detail") render();
}
var consolTimer = null;
function renderConsolidado(){
  var C = state._consol;
  if(!C){ state._consol = {items:null, cargando:true}; cargarConsolidado(); C = state._consol; }
  if(!consolTimer){
    consolTimer = setInterval(function(){
      if(state.identity && state.identity.rol==="administrador" && state.adminTab==="consolidado" && state.view!=="detail" && !(state._consol&&state._consol.cargando)) cargarConsolidado();
    }, 20000);
  }
  var html = renderTopbar() + '<div class="wrap">' + renderAdminNav("consolidado");
  html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;">'+
    '<div><p class="eyebrow">Líder logístico regional</p><h1 style="font-size:22px;">Informe consolidado · Eje Cafetero</h1>'+
    '<p class="hint">'+(C.ts?'Actualizado a las '+new Date(C.ts).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})+' · se refresca solo cada 20 s':'Cargando…')+(C.error?' · <span style="color:var(--danger);">'+esc(C.error)+'</span>':'')+'</p></div>'+
    '<div style="display:flex;gap:8px;"><button class="btn sm" id="btnRefrescar">'+(C.cargando?"Actualizando…":"Actualizar")+'</button><button class="btn sm" id="btnExcelConsol"'+(C.items?"":" disabled")+'>Descargar Excel</button></div>'+
  '</div>';
  html += C.items ? renderIndicadoresTab(C.items, {consolidado:true}) : '<div class="card empty">Cargando información de todas las ciudades…</div>';
  html += '</div>';
  root.innerHTML = html;
  wireTopbar(); wireAdminNav(); wireIndicadoresTab();
  root.querySelector("#btnRefrescar").onclick = function(){ if(!(state._consol&&state._consol.cargando)) cargarConsolidado(); };
  root.querySelector("#btnExcelConsol").onclick = function(){
    var ref = (state._ix && state._ix.ref) || todayISO(), items = (state._consol&&state._consol.items)||[];
    var lotes = filasLotes(items, {}, ref);
    descargarExcel([
      {nombre:"Resumen por ciudad", filas:filasResumenCiudad(lotes)},
      {nombre:"Lotes", filas:lotes},
      {nombre:"Cruce de cantidades", filas:filasCruce(items, {})}
    ], "Semaforo Eje Cafetero "+ref+".xlsx");
  };
}

function showUploadModal(){
  var idn = state.identity, esAdmin = idn.rol==="administrador";
  var m = document.createElement("div");
  m.className = "modal-bg";
  m.innerHTML = '<div class="modal">'+
    '<div class="modal-head"><h2 style="font-size:17px;">Cargar archivo de SIESA</h2><button id="mClose">×</button></div>'+
    (esAdmin
      ? '<div class="field"><label>Ciudad de la carga</label><select id="upCiudad">'+CIUDADES.map(function(c){ return '<option value="'+esc(c.nombre)+'"'+(state._filtroCiudad===c.nombre?" selected":"")+'>'+esc(c.nombre)+' · C.O. '+c.co+'</option>'; }).join("")+'</select></div>'
      : '<p class="hint" style="margin-bottom:8px;">La carga quedará en <b>'+esc(idn.ciudad)+'</b>. Solo los usuarios de esa ciudad (y el administrador) la verán.</p>')+
    '<p class="hint" style="margin-bottom:12px;">Selecciona el Excel exportado de SIESA (opción "cantidades en unidades de empaque"). Se leen las columnas: Bodega, Desc. bodega, Referencia, Desc. item, U.M., Factor U.M., Existencia, GRUPO SHOPPER, LINEA PROVEEDOR, MARCA, Código barra principal, Costo prom. unit./tot., Calidad Perecedero. Si el archivo trae una columna opcional <b>"Asignar a"</b> con el <b>nombre</b> del auxiliar, esa asignación se precarga cuando coincide con un usuario de la ciudad (igual podrás ajustarla luego).</p>'+
    '<div class="field"><input type="file" id="fileInput" accept=".xlsx,.xls"></div>'+
    '<div class="field" id="fileStatus" style="font-size:13px;color:var(--muted);"></div>'+
    '<button class="btn primary block" id="mConfirm" disabled>Crear carga</button>'+
  '</div>';
  document.body.appendChild(m);
  var parsed = null;
  function ciudadElegida(){ var s = m.querySelector("#upCiudad"); return s ? s.value : idn.ciudad; }
  /* "Asignar a" del Excel -> id de usuario auxiliar de la ciudad (nombre completo o primer nombre único) */
  function resolverAsignado(texto, ciudad){
    var t = slugNombre(texto); if(!t) return null;
    var aux = usuariosDeCiudad(ciudad, "operario");
    var exact = aux.filter(function(u){ return slugNombre(u.nombre)===t; });
    if(exact.length===1) return exact[0].id;
    var porPrimer = aux.filter(function(u){ return slugNombre(primerNombre(u.nombre))===t; });
    return porPrimer.length===1 ? porPrimer[0].id : null;
  }
  m.querySelector("#mClose").onclick = function(){ m.remove(); };
  m.onclick = function(e){ if(e.target===m) m.remove(); };
  m.querySelector("#fileInput").onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    var status = m.querySelector("#fileStatus");
    status.textContent = "Leyendo archivo...";
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var wb = XLSX.read(ev.target.result, {type:"array"});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, {defval:""});
        var mapped = rows.map(function(r){
          return {
            referencia: String(r["Referencia"]||"").trim(),
            descItem: String(r["Desc. item"]||"").trim(),
            barcode: String(r["Código barra principal"]||"").trim(),
            um: String(r["U.M."]||"").trim(),
            factorUM: Number(r["Factor U.M."])||1,
            existenciaUM: Number(r["Existencia"])||0,
            grupoShopper: String(r["GRUPO SHOPPER"]||"").trim(),
            lineaProveedor: String(r["LINEA PROVEEDOR"]||"").trim(),
            marca: String(r["MARCA"]||"").trim(),
            costoUnit: Number(r["Costo prom. unit. (ins)"])||0,
            costoTotUM: Number(r["Costo prom. tot. (ins)"])||0,
            perecedero: String(r["Calidad Perecedero"]||"").trim().toLowerCase(),
            bodega: String(r["Bodega"]||"").trim(),
            bodegaDesc: String(r["Desc. bodega"]||"").trim(),
            asignarTexto: String(r["Asignar a"]||"").trim()
          };
        }).filter(function(x){ return x.referencia && x.perecedero==="si"; });
        if(!mapped.length){ status.innerHTML = '<span style="color:var(--danger);">No se encontraron filas con Calidad Perecedero = "si". Revisa el archivo.</span>'; return; }
        parsed = mapped;
        var conTexto = mapped.filter(function(x){ return x.asignarTexto; }).length;
        var msg = 'Listo: <b>'+mapped.length+'</b> referencias perecederas en bodega <b>'+esc(mapped[0].bodega)+' - '+esc(mapped[0].bodegaDesc)+'</b>.';
        if(conTexto) msg += '<br>La columna "Asignar a" trae '+conTexto+' filas; se asignarán las que coincidan con un auxiliar de la ciudad elegida.';
        status.innerHTML = msg;
        m.querySelector("#mConfirm").disabled = false;
      }catch(err){
        status.innerHTML = '<span style="color:var(--danger);">No se pudo leer el archivo: '+esc(err.message||err)+'</span>';
      }
    };
    reader.readAsArrayBuffer(f);
  };
  m.querySelector("#mConfirm").onclick = async function(){
    if(!parsed) return;
    var ciudad = ciudadElegida(), c = ciudadPorNombre(ciudad);
    var deBodega = ciudadPorBodega(parsed[0].bodega);
    if(deBodega && deBodega.nombre!==ciudad){
      var seguir = await askConfirm('La bodega '+parsed[0].bodega+' corresponde a '+deBodega.nombre+', pero la carga se está creando en '+ciudad+'. ¿Continuar de todos modos?');
      if(!seguir) return;
    }
    var items = parsed.map(function(x){
      var o = Object.assign({}, x); delete o.asignarTexto;
      o.asignadoA = resolverAsignado(x.asignarTexto, ciudad);
      return o;
    });
    var operarios = Array.from(new Set(items.filter(function(x){return x.asignadoA;}).map(function(x){return x.asignadoA;})));
    var meta = {bodega:parsed[0].bodega, bodegaDesc:parsed[0].bodegaDesc, ciudad:ciudad, co:c?c.co:"", creadoPor:idn.nombre, creadoPorId:idn.id, totalItems:items.length, operarios:operarios};
    var cid = await Store.createCarga(meta, items);
    m.remove();
    openCarga(cid);
  };
}

/* Modal para elegir uno o varios usuarios de una lista (reemplaza escribir correos). */
function askPickUsers(titulo, lista){
  return new Promise(function(resolve){
    var m = document.createElement("div");
    m.className = "modal-bg";
    m.innerHTML = '<div class="modal" style="max-width:420px;">'+
      '<div class="modal-head"><h2 style="font-size:17px;">'+esc(titulo)+'</h2><button id="pkClose">×</button></div>'+
      (lista.length ? lista.map(function(u){
        return '<label class="assign-check" style="padding:8px 4px;border-bottom:1px solid var(--border);cursor:pointer;"><input type="checkbox" value="'+esc(u.id)+'" checked> <span>'+esc(u.nombre)+'</span></label>';
      }).join("") : '<p class="hint">No hay auxiliares registrados en esta ciudad.</p>')+
      '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px;">'+
        '<button class="btn" id="pkCancel">Cancelar</button><button class="btn primary" id="pkOk"'+(lista.length?"":" disabled")+'>Repartir</button>'+
      '</div></div>';
    document.body.appendChild(m);
    function close(v){ m.remove(); resolve(v); }
    m.querySelector("#pkClose").onclick = function(){ close(null); };
    m.querySelector("#pkCancel").onclick = function(){ close(null); };
    m.querySelector("#pkOk").onclick = function(){
      close(Array.from(m.querySelectorAll("input:checked")).map(function(i){ return i.value; }));
    };
    m.onclick = function(e){ if(e.target===m) close(null); };
  });
}

function wireAsignarTab(){
  var sel = root.querySelector("#opSelect");
  if(!sel) return;
  sel.onchange = function(e){ state.operarioInput = e.target.value; };
  root.querySelectorAll(".rowchk").forEach(function(c){
    c.onchange = function(){ state.selectedIds[c.getAttribute("data-id")] = c.checked; };
  });
  root.querySelector("#btnSelAll").onclick = function(){
    var todas = state.items.every(function(it){ return state.selectedIds[it.id]; });
    state.items.forEach(function(it){ state.selectedIds[it.id] = !todas; });
    render();
  };
  root.querySelector("#btnAssign").onclick = async function(){
    var ids = Object.keys(state.selectedIds).filter(function(k){return state.selectedIds[k];});
    var op = state.operarioInput;
    if(!ids.length){ await notify("Selecciona al menos una referencia."); return; }
    if(!op){ await notify("Elige el auxiliar al que se asignan."); return; }
    try{ await Store.assignItems(state.currentCargaId, ids, op); }
    catch(err){ await notify("No se pudo asignar: "+(err&&err.message?err.message:err)); return; }
    state.selectedIds = {}; state.operarioInput = ""; render();
  };
  root.querySelector("#btnAutoAssign").onclick = async function(){
    var elegidos = await askPickUsers("Repartir las referencias sin asignar entre:", auxiliaresDeLaCarga());
    if(!elegidos || !elegidos.length) return;
    var unassigned = state.items.filter(function(it){return !it.asignadoA;}).map(function(it){return it.id;});
    if(!unassigned.length){ await notify("No hay referencias sin asignar."); return; }
    var perOp = Math.ceil(unassigned.length/elegidos.length);
    try{
      for(var j=0;j<elegidos.length;j++){
        var slice = unassigned.slice(j*perOp,(j+1)*perOp);
        if(slice.length) await Store.assignItems(state.currentCargaId, slice, elegidos[j]);
      }
    }catch(err){ await notify("No se pudo repartir: "+(err&&err.message?err.message:err)); return; }
    render();
  };
}

function renderCruceTab(items){
  var html = '<div class="banner">Cruce automático: existencia de sistema (convertida de unidades de empaque a unidades con el Factor U.M.) vs. suma de cantidades físicas registradas por el operario. RN-07 / RF-13.</div>';
  html += '<div class="card" style="padding:0;"><div class="tablewrap"><table><thead><tr>'+
    '<th>Referencia</th><th>Descripción</th><th>U.M. / Factor</th><th>Existencia sistema (und)</th><th>Físico contado (und)</th><th>Diferencia</th><th>Semáforo</th>'+
  '</tr></thead><tbody>';
  items.forEach(function(it){
    var sisUnid = (it.existenciaUM||0) * (it.factorUM||1);
    var fisico = (it.registros||[]).reduce(function(s,r){ return s + (Number(r.cantidad)||0); }, 0);
    var diff = fisico - sisUnid;
    var pct = sisUnid ? Math.abs(diff)/sisUnid : (fisico?1:0);
    var estado = (!it.registros || !it.registros.length) ? {cls:"neutral",txt:"Sin contar"} : pct<=0.02 ? {cls:"green",txt:"Cuadra"} : pct<=0.10 ? {cls:"amber",txt:"Diferencia leve"} : {cls:"red",txt:"Diferencia alta"};
    html += '<tr>'+
      '<td class="mono">'+esc(it.referencia)+'</td>'+
      '<td>'+esc(it.descItem)+'</td>'+
      '<td class="mono">'+esc(it.um)+' / ×'+it.factorUM+'</td>'+
      '<td class="num">'+fmtNum(sisUnid,1)+'</td>'+
      '<td class="num">'+((it.registros&&it.registros.length)?fmtNum(fisico,1):"—")+'</td>'+
      '<td class="num">'+((it.registros&&it.registros.length)?(diff>=0?"+":"")+fmtNum(diff,1):"—")+'</td>'+
      '<td><span class="pill '+estado.cls+' dot">'+estado.txt+'</span></td>'+
    '</tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}

/* ================= informe de semáforo (adaptado del panel vigente de Eje Cafetero) ================= */
var IX_DEFAULT = {banda:null, linea:"", q:"", sortK:"dias", sortDir:1, lim:60, bmode:"n", alertAll:false, ref:null};
function ix(){ if(!state._ix) state._ix = Object.assign({}, IX_DEFAULT); return state._ix; }
function fmtMoneyC(n){ return Math.abs(n)>=1e6 ? "$ "+Math.round(n/1e6).toLocaleString("es-CO")+" M" : fmtMoney(n); }
function fmtPct(x){ return x.toLocaleString("es-CO",{maximumFractionDigits:1}); }

function ixLotes(items, ref){
  var out = [];
  items.forEach(function(it){
    var cu = (it.costoUnit||0)/(it.factorUM||1); /* SIESA entrega el costo por empaque (caja): se lleva a costo por unidad */
    (it.registros||[]).forEach(function(r){
      var cant = Number(r.cantidad)||0, d = diasEntre(r.fechaVenc, ref);
      out.push({cod:it.referencia, desc:it.descItem||"", linea:it.lineaProveedor||"Sin línea", ciudad:it._ciudad||"", bodega:it.bodega||"", bdesc:it.bodegaDesc||"", cant:cant, fecha:r.fechaVenc, dias:d, banda:bandaDe(d), costo:cant*cu});
    });
  });
  return out;
}

function ixPill(banda){ var b = BANDA_POR_ID[banda]; return '<span class="pill '+b.cls+' dot">'+b.n+'</span>'; }
function ixDiasTxt(d){ return d<0 ? "vencido hace "+(-d)+(d===-1?" día":" días") : d===0 ? "vence hoy" : "en "+d+(d===1?" día":" días"); }

function renderIndicadoresTab(items, opts){
  var S = ix(), consol = !!(opts && opts.consolidado);
  var ref = S.ref || todayISO();
  var todos = ixLotes(items, ref);
  if(!todos.length){
    return '<div class="card empty">Todavía no hay lotes registrados (cantidad + fecha de vencimiento) '+(consol?'en ninguna ciudad':'en esta carga')+'. Este informe se llena a medida que los auxiliares van capturando información.</div>';
  }
  var lineas = Array.from(new Set(todos.map(function(l){ return l.linea; }))).sort();
  if(S.linea && lineas.indexOf(S.linea)<0) S.linea = "";
  if(!consol){ S.ciudad = ""; S.bodega = ""; }
  var q = (S.q||"").trim().toLowerCase();
  function pasaFiltros(l, conCiudad){
    if(S.linea && l.linea!==S.linea) return false;
    if(q && (l.cod+" "+l.desc).toLowerCase().indexOf(q)<0) return false;
    if(conCiudad && S.ciudad && l.ciudad!==S.ciudad) return false;
    if(conCiudad && S.bodega && l.bodega!==S.bodega) return false;
    return true;
  }
  var base = todos.filter(function(l){ return pasaFiltros(l, true); });

  var htmlCiudades = "", ciudadChart = "", bodegaSel = "";
  if(consol){
    var nombresCiudades = CIUDADES.map(function(c){ return c.nombre; });
    htmlCiudades = '<nav class="tabs" role="tablist" aria-label="Ciudad">'+
      '<button data-ciudad="" class="'+(!S.ciudad?"active":"")+'">Eje Cafetero <small class="hint">'+fmtNum(todos.length,0)+'</small></button>'+
      nombresCiudades.map(function(n){
        var c = todos.filter(function(l){ return l.ciudad===n; }).length;
        return '<button data-ciudad="'+esc(n)+'" class="'+(S.ciudad===n?"active":"")+'">'+esc(n)+' <small class="hint">'+fmtNum(c,0)+'</small></button>';
      }).join("")+'</nav>';
    var bods = {};
    todos.forEach(function(l){ if(!S.ciudad || l.ciudad===S.ciudad) bods[l.bodega] = l.bdesc; });
    if(S.bodega && !(S.bodega in bods)) S.bodega = "";
    bodegaSel = '<select id="ixBodega" class="grow" aria-label="Bodega"><option value="">Todas las bodegas</option>'+
      Object.keys(bods).sort().map(function(k){ return '<option value="'+esc(k)+'"'+(S.bodega===k?" selected":"")+'>'+esc(k+(bods[k]?" · "+bods[k]:""))+'</option>'; }).join("")+'</select>';
    /* costo por vencer por ciudad (respeta línea y búsqueda, no la ciudad elegida) */
    var porCiudad = {};
    todos.forEach(function(l){
      if(!pasaFiltros(l, false) || l.dias>60) return;
      var o = porCiudad[l.ciudad] || (porCiudad[l.ciudad] = {vencido:0, b1:0, b2:0});
      o[l.banda] += l.costo;
    });
    var cMax = 0; Object.keys(porCiudad).forEach(function(k){ var o = porCiudad[k]; cMax = Math.max(cMax, o.vencido+o.b1+o.b2); });
    ciudadChart = '<section class="card"><div class="hd"><h3>Costo por vencer por ciudad</h3><p>Existencia vencida y que vence en 60 días o menos. Selecciona una ciudad para verla.</p></div>'+
      (Object.keys(porCiudad).length ? nombresCiudades.filter(function(n){ return porCiudad[n]; }).map(function(n){
        var o = porCiudad[n], tot = o.vencido+o.b1+o.b2;
        return '<button type="button" class="band-row" data-ciudad="'+esc(n)+'" aria-pressed="'+(S.ciudad===n)+'" style="grid-template-columns:minmax(80px,110px) 1fr auto;">'+
          '<span class="nm">'+esc(n)+'</span>'+
          '<span class="bar-track">'+["vencido","b1","b2"].map(function(k){ return o[k]>0 ? '<span class="bar-seg '+BANDA_POR_ID[k].bg+'" style="width:'+(o[k]/cMax*100)+'%"></span>' : ""; }).join("")+'</span>'+
          '<span class="num"><b>'+fmtMoneyC(tot)+'</b></span></button>';
      }).join("") : '<p class="note">No hay existencia vencida ni por vencer en 60 días para esta selección.</p>')+
    '</section>';
  }

  var by = {}; BANDAS.forEach(function(b){ by[b.id] = {refs:{}, u:0, c:0, n:0}; });
  var refs = {}, uTot = 0, cTot = 0;
  base.forEach(function(l){
    var b = by[l.banda]; b.refs[l.cod] = 1; b.u += l.cant; b.c += l.costo; b.n++;
    refs[l.cod] = 1; uTot += l.cant; cTot += l.costo;
  });
  function pc(x){ return fmtPct(cTot ? x/cTot*100 : 0); }
  function kpi(l, v, n, c){ return '<div class="kpi '+(c||"")+'"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="n">'+(n||"")+'</div></div>'; }

  var html = htmlCiudades + '<div class="ix-bar">'+
    '<label class="hint" for="ixRef" style="margin:0;">Fecha de referencia</label>'+
    '<input type="date" id="ixRef" value="'+esc(ref)+'">'+
    '<button class="btn sm" id="ixHoy" type="button">Hoy</button>'+
    bodegaSel+
    '<select id="ixLinea" class="grow" aria-label="Línea proveedor"><option value="">Todas las líneas de proveedor</option>'+
      lineas.map(function(k){ return '<option value="'+esc(k)+'"'+(S.linea===k?" selected":"")+'>'+esc(k)+'</option>'; }).join("")+'</select>'+
    '<input type="search" id="ixQ" class="grow" placeholder="Buscar código o descripción" value="'+esc(S.q||"")+'" aria-label="Buscar código o descripción">'+
    (S.banda ? '<span class="ix-chip">Rango: '+esc(BANDA_POR_ID[S.banda].n)+'<button type="button" data-x="banda" aria-label="Quitar rango">×</button></span>' : '')+
    '<button class="btn sm" id="ixLimpiar" type="button">Limpiar filtros</button>'+
  '</div>';

  html += '<div class="kpis">'+
    kpi("Referencias", fmtNum(Object.keys(refs).length,0), fmtNum(base.length,0)+" lotes registrados")+
    kpi("Unidades", fmtNum(uTot,0), "contadas físicamente")+
    kpi("Costo de existencia", fmtMoneyC(cTot), fmtMoney(cTot))+
    kpi("Costo vencido", fmtMoneyC(by.vencido.c), pc(by.vencido.c)+" % · "+fmtNum(by.vencido.n,0)+" lotes", "crit")+
    kpi("Costo de 1 a 30 días", fmtMoneyC(by.b1.c), pc(by.b1.c)+" % · "+fmtNum(by.b1.n,0)+" lotes", "risk")+
    kpi("Costo de 31 a 60 días", fmtMoneyC(by.b2.c), pc(by.b2.c)+" % · "+fmtNum(by.b2.n,0)+" lotes", "warn")+
  '</div>';

  /* rangos de vencimiento */
  var mx = 0; BANDAS.forEach(function(b){ mx = Math.max(mx, by[b.id].c); });
  var bandsHtml = BANDAS.map(function(b){
    var x = by[b.id];
    return '<button type="button" class="band-row" data-b="'+b.id+'" aria-pressed="'+(S.banda===b.id)+'" aria-label="Filtrar por '+b.n+'">'+
      '<span class="nm"><span class="dotc '+b.bg+'"></span>'+b.n+'</span>'+
      '<span class="bar-track"><span class="bar-seg '+b.bg+'" style="width:'+(mx ? Math.max(x.c/mx*100, x.c>0?2:0) : 0)+'%"></span></span>'+
      '<span class="num"><b>'+fmtMoneyC(x.c)+'</b><span>'+fmtNum(Object.keys(x.refs).length,0)+' refs · '+fmtNum(x.u,0)+' un. · '+pc(x.c)+' %</span></span></button>';
  }).join("");

  /* líneas de proveedor con más alertas (vencido + 1 a 30 + 31 a 60) */
  var m = S.bmode, porLinea = {};
  base.forEach(function(l){
    if(l.dias>60) return;
    var o = porLinea[l.linea] || (porLinea[l.linea] = {linea:l.linea, vencido:0, b1:0, b2:0});
    o[l.banda] += (m==="n" ? 1 : l.costo);
  });
  var lineaArr = Object.keys(porLinea).map(function(k){ var o = porLinea[k]; o.tot = o.vencido+o.b1+o.b2; return o; })
    .sort(function(a,b){ return b.tot-a.tot; }).slice(0,10);
  var lmx = lineaArr.length ? lineaArr[0].tot : 1;
  var lineaHtml = lineaArr.length ? lineaArr.map(function(o){
    return '<button type="button" class="band-row" data-lin="'+esc(o.linea)+'" aria-pressed="'+(S.linea===o.linea)+'" style="grid-template-columns:minmax(110px,170px) 1fr auto;">'+
      '<span class="nm" style="overflow-wrap:anywhere;">'+esc(o.linea)+'</span>'+
      '<span class="bar-track">'+["vencido","b1","b2"].map(function(k){ return o[k]>0 ? '<span class="bar-seg '+BANDA_POR_ID[k].bg+'" style="width:'+(o[k]/lmx*100)+'%"></span>' : ""; }).join("")+'</span>'+
      '<span class="num"><b>'+(m==="n" ? fmtNum(o.tot,0)+" lotes" : fmtMoneyC(o.tot))+'</b></span></button>';
  }).join("") : '<p class="note">No hay existencia vencida ni que venza en 60 días o menos para esta selección.</p>';

  html += '<div class="ix-grid">'+
    '<section class="card"><div class="hd"><h3>Rangos de vencimiento</h3><p>Costo de existencia por días para vencer. Selecciona un rango para filtrar la tabla.</p></div>'+bandsHtml+'</section>'+
    ciudadChart+
    '<section class="card"><div class="hd"><h3>Líneas de proveedor con más alertas</h3><p>Existencia vencida (morado), de 1 a 30 días (rojo) y de 31 a 60 días (amarillo). Selecciona una línea para filtrar.</p></div>'+
      '<div class="seg" id="ixMode" role="group" aria-label="Medida"><button type="button" data-m="n" aria-pressed="'+(m==="n")+'">Lotes</button><button type="button" data-m="c" aria-pressed="'+(m==="c")+'">Costo</button></div>'+
      lineaHtml+
    '</section></div>';

  /* alertas */
  var crit = base.filter(function(l){ return l.dias<=10; }).sort(function(a,b){ return a.dias-b.dias; });
  var m30 = base.filter(function(l){ return l.dias>10 && l.dias<=30 && l.costo>=1000000; }).sort(function(a,b){ return b.costo-a.costo; });
  var allm30 = base.filter(function(l){ return l.dias>10 && l.dias<=30; }).length;
  var alertas = crit.map(function(l){ return {l:l, pill: l.dias<=0 ? "Vencido" : "10 días o menos", venc: l.dias<=0}; })
    .concat(m30.map(function(l){ return {l:l, pill:"11 a 30 días", venc:false}; }));
  var lim = S.alertAll ? alertas.length : 6;
  var alertHtml = alertas.slice(0,lim).map(function(a){
    return '<li class="alert'+(a.venc?" venc":"")+'"><span class="pill '+(a.venc?"critical":"red")+' dot">'+a.pill+'</span>'+
      '<div class="t"><b>'+esc(a.l.desc)+'</b><span>'+esc(a.l.cod)+' · '+fmtNum(a.l.cant,0)+' un. · vence el '+fmtFecha(a.l.fecha)+' ('+ixDiasTxt(a.l.dias)+')</span></div>'+
      '<div class="m">'+fmtMoney(a.l.costo)+'</div></li>';
  }).join("") || '<li class="note">Sin alertas para esta selección.</li>';

  /* top 10 referencias en riesgo (riesgo ponderado) */
  var porRef = {};
  base.forEach(function(l){
    var w = BANDA_POR_ID[l.banda].w; if(!w) return;
    var o = porRef[l.cod] || (porRef[l.cod] = {cod:l.cod, desc:l.desc, c:0, u:0, score:0, dmin:1e9});
    o.c += l.costo; o.u += l.cant; o.score += l.costo*w; if(l.dias<o.dmin) o.dmin = l.dias;
  });
  var top = Object.keys(porRef).map(function(k){ return porRef[k]; }).sort(function(a,b){ return b.score-a.score; }).slice(0,10);
  var tmx = top.length ? top[0].score : 1;
  var topHtml = top.map(function(o,i){
    var bd = BANDA_POR_ID[bandaDe(o.dmin)];
    return '<li class="t10"><span class="rk">'+(i+1)+'</span><div><b>'+esc(o.desc)+'</b>'+
      '<div class="meta"><span>'+esc(o.cod)+'</span><span>'+fmtNum(o.u,0)+' un. en riesgo</span><span>Primer vencimiento: '+(o.dmin<=0?"vencido":o.dmin+" días")+'</span>'+
      '<span class="pill '+bd.cls+' dot">'+bd.n+'</span><span class="val">'+fmtMoney(o.c)+'</span></div>'+
      '<div class="bar"><i class="'+bd.bg+'" style="width:'+(o.score/tmx*100)+'%"></i></div></div></li>';
  }).join("") || '<li class="note">No hay referencias con 90 días o menos en esta selección.</li>';

  html += '<div class="ix-grid">'+
    '<section class="card"><div class="hd"><h3>Alertas</h3><p>'+fmtNum(crit.length,0)+(crit.length===1?" lote vence":" lotes vencen")+' en 10 días o menos (incluye vencidos) · '+fmtNum(allm30,0)+' entre 11 y 30 días (se listan los de costo igual o mayor a $ 1.000.000)</p></div>'+
      '<ul class="alerts">'+alertHtml+'</ul>'+
      (alertas.length>6 ? '<button class="btn sm" id="ixAlertMore" type="button" style="align-self:flex-start;">'+(S.alertAll?"Ver menos":"Ver las "+alertas.length+" alertas")+'</button>' : '')+
    '</section>'+
    '<section class="card"><div class="hd"><h3>Top 10 referencias en riesgo</h3><p>Mayor costo que se perdería si lo que vence en 90 días o menos termina destruido.</p></div>'+
      '<ol class="top10">'+topHtml+'</ol>'+
      '<p class="note">Orden por riesgo ponderado: costo × 100 % si está vencido o vence en 30 días o menos, × 60 % de 31 a 60 días y × 30 % de 61 a 90 días.</p>'+
    '</section></div>';

  /* detalle */
  var lista = base.filter(function(l){ return !S.banda || l.banda===S.banda; });
  var k = S.sortK, dir = S.sortDir;
  lista.sort(function(a,b){
    var x, y;
    if(k==="dias"||k==="fecha"||k==="banda"){ x = a.dias; y = b.dias; }
    else if(k==="cant"||k==="costo"){ x = a[k]; y = b[k]; }
    else { x = String(a[k]).toLowerCase(); y = String(b[k]).toLowerCase(); }
    return ((x<y?-1:x>y?1:0)*dir) || (a.dias-b.dias);
  });
  var COLS = [["cod","Referencia"],["desc","Descripción"],["linea","Línea proveedor"],["cant","Unidades","r"],["fecha","Vence","r"],["dias","Días","r"],["costo","Costo existencia","r"],["banda","Semáforo"]];
  if(consol) COLS.unshift(["ciudad","Ciudad"],["bodega","Bodega"]);
  var thead = '<tr>'+COLS.map(function(c){
    var sk = c[0]==="fecha"||c[0]==="banda" ? "dias" : c[0];
    var activo = c[0]===k;
    return '<th class="'+(c[2]||"")+'" data-k="'+sk+'" aria-sort="'+(activo?(dir>0?"ascending":"descending"):"none")+'">'+c[1]+'</th>';
  }).join("")+'</tr>';
  var tot = 0; lista.forEach(function(l){ tot += l.costo; });
  var tbody = lista.slice(0,S.lim).map(function(l){
    return '<tr>'+(consol?'<td>'+esc(l.ciudad)+'</td><td class="mono">'+esc(l.bodega)+'</td>':'')+'<td class="mono">'+esc(l.cod)+'</td><td>'+esc(l.desc)+'</td><td>'+esc(l.linea)+'</td>'+
      '<td class="num">'+fmtNum(l.cant,0)+'</td><td class="num">'+fmtFecha(l.fecha)+'</td><td class="num">'+l.dias+'</td>'+
      '<td class="num">'+fmtMoney(l.costo)+'</td><td>'+ixPill(l.banda)+'</td></tr>';
  }).join("") || '<tr><td colspan="10" class="empty">No hay lotes para esta selección.</td></tr>';
  html += '<section class="card ix"><div class="hd"><h3>Detalle de inventario</h3><p>'+fmtNum(lista.length,0)+' lotes · '+fmtMoney(tot)+'</p></div>'+
    '<div class="ix-table tablewrap"><table id="ixTbl"><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>'+
    (lista.length>S.lim ? '<button class="btn sm" id="ixDetMore" type="button" style="align-self:flex-start;">Mostrar '+Math.min(60,lista.length-S.lim)+' más ('+fmtNum(lista.length-S.lim,0)+' restantes)</button>' : '')+
  '</section>';

  html += '<p class="footer-note" style="text-align:left;">Costo por unidad = costo promedio de SIESA ÷ Factor U.M. (SIESA lo entrega por empaque/caja). Las unidades y fechas son las registradas por los operarios en el conteo físico.</p>';
  return html;
}

function wireIndicadoresTab(){
  var S = ix();
  var $ = function(sel){ return root.querySelector(sel); };
  if(!$("#ixRef")) return;
  $("#ixRef").onchange = function(e){ if(e.target.value){ S.ref = e.target.value; render(); } };
  $("#ixHoy").onclick = function(){ S.ref = null; render(); };
  $("#ixLinea").onchange = function(e){ S.linea = e.target.value; S.lim = 60; render(); };
  var qEl = $("#ixQ");
  qEl.oninput = debounce(function(e){ S.q = e.target.value; S.lim = 60; state._ixFocusQ = true; render(); }, 200);
  if(state._ixFocusQ){ state._ixFocusQ = false; qEl.focus(); try{ qEl.setSelectionRange(qEl.value.length, qEl.value.length); }catch(e){} }
  $("#ixLimpiar").onclick = function(){ S.banda = null; S.linea = ""; S.q = ""; S.bodega = ""; S.lim = 60; render(); };
  var bsel = $("#ixBodega"); if(bsel) bsel.onchange = function(e){ S.bodega = e.target.value; S.lim = 60; render(); };
  root.querySelectorAll("[data-ciudad]").forEach(function(b){
    b.onclick = function(){
      var c = b.getAttribute("data-ciudad");
      S.ciudad = (b.classList.contains("band-row") && S.ciudad===c) ? "" : c; S.bodega = ""; S.lim = 60; render();
    };
  });
  var chip = $("[data-x=banda]"); if(chip) chip.onclick = function(){ S.banda = null; render(); };
  root.querySelectorAll("[data-b]").forEach(function(b){ b.onclick = function(){ var id = b.getAttribute("data-b"); S.banda = S.banda===id ? null : id; S.lim = 60; render(); }; });
  root.querySelectorAll("[data-lin]").forEach(function(b){ b.onclick = function(){ var l = b.getAttribute("data-lin"); S.linea = S.linea===l ? "" : l; S.lim = 60; render(); }; });
  root.querySelectorAll("#ixMode [data-m]").forEach(function(b){ b.onclick = function(){ S.bmode = b.getAttribute("data-m"); render(); }; });
  var am = $("#ixAlertMore"); if(am) am.onclick = function(){ S.alertAll = !S.alertAll; render(); };
  var dm = $("#ixDetMore"); if(dm) dm.onclick = function(){ S.lim += 60; render(); };
  root.querySelectorAll("#ixTbl th").forEach(function(th){
    th.onclick = function(){
      var k = th.getAttribute("data-k");
      if(S.sortK===k) S.sortDir *= -1; else { S.sortK = k; S.sortDir = (k==="cant"||k==="costo") ? -1 : 1; }
      render();
    };
  });
}

/* ================= exportar a Excel ================= */
function filasLotes(items, carga, ref){
  var out = [];
  items.forEach(function(it){
    var cu = (it.costoUnit||0)/(it.factorUM||1);
    (it.registros||[]).forEach(function(r){
      var d = diasEntre(r.fechaVenc, ref), cant = Number(r.cantidad)||0;
      out.push({
        "Ciudad":(carga&&carga.ciudad)||it._ciudad||"", "Bodega":it.bodega||(carga&&carga.bodega)||"", "Desc. bodega":it.bodegaDesc||(carga&&carga.bodegaDesc)||"",
        "Línea proveedor":it.lineaProveedor||"", "Código":it.referencia, "Descripción":it.descItem, "Marca":it.marca||"",
        "Costo unitario":Math.round(cu*100)/100, "Unidades":cant, "Empaque":it.um||"", "Vence":fmtFecha(r.fechaVenc),
        "Días":d, "Costo total":Math.round(cant*cu), "Semáforo":BANDA_POR_ID[bandaDe(d)].n, "Registrado por":nombreDe(r.capturadoPor)
      });
    });
  });
  return out;
}
function filasCruce(items, carga){
  return items.map(function(it){
    var sis = (it.existenciaUM||0)*(it.factorUM||1);
    var fis = (it.registros||[]).reduce(function(s,r){ return s+(Number(r.cantidad)||0); }, 0);
    var contado = it.registros && it.registros.length;
    var pct = sis ? Math.abs(fis-sis)/sis : (fis?1:0);
    return {
      "Ciudad":(carga&&carga.ciudad)||it._ciudad||"", "Bodega":it.bodega||(carga&&carga.bodega)||"", "Código":it.referencia, "Descripción":it.descItem,
      "Empaque":it.um||"", "Factor":it.factorUM||1, "Existencia sistema (und)":Math.round(sis*100)/100,
      "Físico contado (und)":contado?fis:"", "Diferencia":contado?Math.round((fis-sis)*100)/100:"",
      "Estado":!contado?"Sin contar":pct<=0.02?"Cuadra":pct<=0.10?"Diferencia leve":"Diferencia alta",
      "Asignado a":nombreDe(it.asignadoA)
    };
  });
}
function filasResumenCiudad(lotes){
  var por = {};
  lotes.forEach(function(l){
    var o = por[l["Ciudad"]||"Sin ciudad"] || (por[l["Ciudad"]||"Sin ciudad"] = {"Ciudad":l["Ciudad"]||"Sin ciudad", "Lotes":0, "Unidades":0, "Costo total":0, "Vencido":0, "1 a 30 días":0, "31 a 60 días":0, "61 a 90 días":0, "Más de 90 días":0});
    o["Lotes"]++; o["Unidades"] += l["Unidades"]; o["Costo total"] += l["Costo total"];
    var k = {"Vencido":"Vencido","De 1 a 30 días":"1 a 30 días","De 31 a 60 días":"31 a 60 días","De 61 a 90 días":"61 a 90 días","Más de 90 días":"Más de 90 días"}[l["Semáforo"]];
    o[k] += l["Costo total"];
  });
  return Object.keys(por).sort().map(function(k){ return por[k]; });
}
function descargarExcel(hojas, nombre){
  if(!window.XLSX){ notify("La librería de Excel no está disponible en este navegador."); return; }
  var wb = XLSX.utils.book_new();
  hojas.forEach(function(h){ XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(h.filas.length?h.filas:[{"Sin datos":""}]), h.nombre.slice(0,31)); });
  XLSX.writeFile(wb, nombre);
}

  var c = cargaActual(), ciudad = c.ciudad ? ciudadPorNombre(c.ciudad) : null;
  var base = location.origin + location.pathname;
  var link = ciudad ? base + "?co=" + ciudad.co : base;
  var m = document.createElement("div");

  m.innerHTML = '<div class="modal"><div class="modal-head"><h2 style="font-size:17px;">Acceso para auxiliares'+(ciudad?' · '+esc(ciudad.nombre):'')+'</h2><button id="mClose">×</button></div>'+
    '<p class="hint" style="margin-bottom:10px;">El auxiliar escanea este código con la cámara de su celular, '+(ciudad?'entra directo a la lista de '+esc(ciudad.nombre)+' ':'elige su ciudad ')+'y toca su nombre. No requiere instalar nada.</p>'+
    '<div class="qr-box"><div id="qrcanvas"></div><code style="font-size:11px;word-break:break-all;text-align:center;">'+esc(link)+'</code></div>'+
  '</div>';

  }catch(e){ m.querySelector("#qrcanvas").textContent = "No se pudo generar el QR."; }
